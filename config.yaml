# RAM-Guard Configuration
# Tune these thresholds based on the host system's baseline behaviour.

scan:
  poll_interval_seconds: 5        # how often the monitor loop runs
  history_window: 12              # number of samples kept per process (for growth-rate calc)

thresholds:
  high_memory_percent: 15.0       # flag if a process uses > this % of total RAM
  leak_growth_mb_per_min: 25.0    # flag if RSS grows faster than this sustained rate
  min_samples_for_leak_check: 4   # don't judge growth until we have this many samples
  excluded_processes: []          # extra process names to never flag, beyond the
                                   # built-in known-benign OS list (e.g. MemCompression)

notifications:
  enabled: true
  cooldown_seconds: 120           # don't re-notify for the same finding within this window
  mobile_push:
    enabled: false
    ntfy_topic: "nitesh-ramguard-k47xq2p9"   # install the ntfy app, subscribe to this exact topic
                                                  # make it unique/hard-to-guess since ntfy topics are public by name
  email:
    enabled: true
    smtp_host: "smtp.gmail.com"     # Gmail's SMTP server (works for any Gmail sender)
    smtp_port: 587
    sender_email: "niteshrudhra@gmail.com"
    sender_app_password: ""         # intentionally blank -- real password comes from the
                                     # RAMGUARD_EMAIL_APP_PASSWORD environment variable, see main.py
    recipient_email: "niteshrudhra@gmail.com"

logging:
  log_file: "ram_guard.log"
  level: "INFO"
  silent_mode: false   # if true, skip desktop/email/mobile notifications entirely —
                        # still logs everything to file. Use for passive baseline runs
                        # where you don't want to be interrupted for 24-48h.

known_vulnerability_scan:
  enabled: true
  check_interval_seconds: 3600    # known-CVE / class scan runs far less often than live monitoring

crash_monitor:
  enabled: true                   # Windows only; silently inert on other platforms
  check_interval_seconds: 30      # how often to poll the Windows Application Event Log
  lookback_minutes: 10            # how far back to look for new crash events each check

signature_scan:
  enabled: true
  check_interval_seconds: 3600    # installed software/host config rarely changes between scans.
                                   # Every match here ALWAYS notifies (see main.py), regardless of
                                   # severity -- a version match against a named CVE is a fact
                                   # about the host, not a heuristic like the other detectors.

fleet_reporting:
  enabled: false                  # off by default -- see fleet_reporting.py and
                                   # fleet_collector_example.py. Not gated by --silent: this is
                                   # the mechanism a fleet deployment relies on INSTEAD of local
                                   # popups, so --silent (which only suppresses local interrupts)
                                   # doesn't suppress this too.
  collector_url: "http://127.0.0.1:9000"   # where fleet_collector_example.py (or a real one) listens.
                                   # Use a literal IP, not "localhost" -- on this machine "localhost"
                                   # added ~2s per request from IPv6-then-IPv4 resolution fallback.
  device_id: ""                   # blank = auto (this machine's hostname)
  api_key: ""                     # optional shared key sent as X-API-Key; must match the
                                   # collector's --api-key if set. Plain HTTP, no TLS -- see
                                   # fleet_reporting.py's docstring for the honest security scope.
